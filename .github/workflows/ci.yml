name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to a pull request replaces its older run. Runs on main are never cancelled,
# so a release image is not abandoned half way.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Not gofmt-formatted:"; echo "$unformatted"; exit 1; fi
      - name: Preview cleanup script tests
        run: scripts/prune-previews.test.sh
      - name: Vet and test (with the race detector)
        run: make test
      - name: Coverage gate (at least 80%)
        run: make cover

  web:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type check, tests and coverage gate (at least 80%)
        run: npm run cover
      - name: Production build
        run: npm run build

  image:
    name: Image
    needs: [go, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # to push to GHCR (main and same-repo pull requests only)
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: version
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error file=VERSION::VERSION must look like 1.2.3, got '$version'"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # What this run publishes:
      #   release: a push to main. latest, sha-<commit> and the VERSION tag.
      #   preview: a pull request from this repository. pr-<number> and <VERSION>-pr<number>.<commit>,
      #            so a change can be tried before it is merged. Never latest or the plain version.
      #   none:    anything else (a pull request from a fork has no permission to push). Built and tested only.
      - name: What to publish
        id: plan
        env:
          VERSION: ${{ steps.version.outputs.version }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          short=${HEAD_SHA::7}
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
            kind=release; app_version=$VERSION
          elif [ "$EVENT" = pull_request ] && [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
            kind=preview; app_version="$VERSION-pr$PR.$short"
          else
            kind=none; app_version="$VERSION-dev.$short"
          fi
          {
            echo "kind=$kind"
            echo "app_version=$app_version"
            echo "short=$short"
            echo "publish=$([ "$kind" = none ] && echo false || echo true)"
          } >> "$GITHUB_OUTPUT"
          echo "This run: $kind (the app will report version $app_version)"

      - uses: docker/setup-buildx-action@v4

      - name: Image labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.version.outputs.image }}
          labels: |
            org.opencontainers.image.version=${{ steps.plan.outputs.app_version }}

      - name: Build the image (for this machine)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: fleetsetup:ci
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.plan.outputs.app_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (the image, real requests through it)
        run: scripts/smoke-image.sh fleetsetup:ci "${{ steps.plan.outputs.app_version }}"

      - name: Log in to GHCR
        if: steps.plan.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A release moves latest and sha-<commit>. Its version tag is only written the first time, so a
      # published version is never silently replaced: bump VERSION to publish a new one.
      - name: Work out the tags
        id: tags
        if: steps.plan.outputs.publish == 'true'
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
          KIND: ${{ steps.plan.outputs.kind }}
          APP_VERSION: ${{ steps.plan.outputs.app_version }}
          SHORT: ${{ steps.plan.outputs.short }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$KIND" = preview ]; then
            tags="$IMAGE:pr-$PR,$IMAGE:$APP_VERSION"
            version_tag="none (a preview, not a release)"
          else
            tags="$IMAGE:latest,$IMAGE:sha-$SHORT"
            if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
              echo "::warning::$IMAGE:$VERSION is already published, so it was not replaced. Bump VERSION to publish a new version tag."
              version_tag="skipped (already published)"
            else
              tags="$tags,$IMAGE:$VERSION"
              version_tag="$VERSION"
            fi
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "version_tag=$version_tag" >> "$GITHUB_OUTPUT"

      - name: Push to GHCR (amd64 and arm64)
        if: steps.plan.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.plan.outputs.app_version }}
          cache-from: type=gha

      - name: Summary
        env:
          KIND: ${{ steps.plan.outputs.kind }}
          TAGS: ${{ steps.tags.outputs.tags }}
          VERSION_TAG: ${{ steps.tags.outputs.version_tag }}
          APP_VERSION: ${{ steps.plan.outputs.app_version }}
        run: |
          {
            if [ "$KIND" = none ]; then
              echo "### Image built and tested (not published)"
              echo
              echo "Pull requests from forks cannot push images."
            elif [ "$KIND" = preview ]; then
              echo "### Preview image published to GHCR"
              echo
              echo "Not \`latest\` and not a release: this is what the pull request would build. The app reports version \`$APP_VERSION\`."
            else
              echo "### Release published to GHCR"
              echo
              echo "Version tag: $VERSION_TAG"
            fi
            if [ -n "$TAGS" ]; then
              echo
              echo "$TAGS" | tr ',' '\n' | while read -r tag; do echo "- \`$tag\`"; done
            fi
          } >> "$GITHUB_STEP_SUMMARY"
